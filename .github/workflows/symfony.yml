# separate terms of service, privacy policy, and support
# documentation.

name: Symfony

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  symfony-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cultivatrace
          POSTGRES_USER: cultiva
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cultiva -d cultivatrace"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      gotenberg:
        image: gotenberg/gotenberg:8
        ports:
          - 3000:3000
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///%kernel.project_dir%/var/ci_fast.sqlite
      POSTGRES_TEST_ADMIN_URL: postgresql://cultiva@127.0.0.1:5432/postgres
      GOTENBERG_DSN: http://127.0.0.1:3000
      GOTENBERG_URL: http://127.0.0.1:3000
      JWT_PASSPHRASE: change-me-in-local-and-prod
      AUDIT_CHAIN_SECRET: ci_test_audit_chain_secret_not_for_production
    steps:
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: sodium, pdo_pgsql, pgsql, pdo_sqlite, sqlite3, fileinfo
        tools: composer:v2
        coverage: none
    - uses: actions/checkout@v4
    - name: Copy .env.test.local
      run: php -r "file_exists('.env.test.local') || copy('.env.test', '.env.test.local');"
    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-
    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
    - name: Generate JWT keypair for tests
      run: |
        mkdir -p var/jwt
        openssl genrsa -aes256 -passout pass:change-me-in-local-and-prod -out var/jwt/private.pem 4096
        openssl rsa -passin pass:change-me-in-local-and-prod -pubout -in var/jwt/private.pem -out var/jwt/public.pem
    - name: Wait for PostgreSQL
      run: |
        until (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; do
          sleep 1
        done
    - name: Wait for Gotenberg
      run: |
        until curl -fsS http://127.0.0.1:3000/version >/dev/null; do
          sleep 1
        done
    - name: Warm up test container (for PHPStan Symfony extension)
      run: php bin/console cache:warmup --env=test
    - name: Static analysis (PHPStan)
      run: composer phpstan
    - name: Fast tests (SQLite, independent of migration tests)
      run: vendor/bin/phpunit
    - name: PostgreSQL 16 integration (create, migrate, test, drop)
      run: composer test:postgresql
    - name: Preserve PlantEvent evidence (including a failing integrity gate)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: plant-event-postgresql-evidence
        path: var/plant-event-evidence/
