name: PHP Composer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.4.1', '8.4']
    env:
      DATABASE_URL: sqlite:///%kernel.project_dir%/var/ci_build.sqlite

    steps:
    - uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: sodium, pdo_sqlite, sqlite3
        tools: composer:v2
        coverage: none
    - uses: actions/checkout@v4

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Audit locked dependencies
      run: composer audit --locked

    - name: Analyse the PlantEvent code changed in P0-06
      run: composer phpstan -- src/Repository/PlantEventRepository.php src/Service/HashChainService.php src/Infrastructure/Persistence/Doctrine/EventListener/PlantEventAppendOnlyListener.php bin/test-postgresql.php tests/PostgreSQL tests/Service/HashChainVerificationTest.php
