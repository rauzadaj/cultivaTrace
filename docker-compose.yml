services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cultivatrace_app
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
      - symfony_var:/var/www/html/var
    depends_on:
      - db
    environment:
      APP_ENV: dev
      APP_AUTO_BOOTSTRAP: "1"
      APP_BOOTSTRAP_SEED_DEMO: "1"
      APP_BOOTSTRAP_SEED_CATALOG: "1"
      DATABASE_URL: postgresql://cultiva:password@db:5432/cultivatrace?serverVersion=13&charset=utf8

  web:
    image: nginx:1.27-alpine
    container_name: cultivatrace_web
    depends_on:
      - app
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  db:
    image: postgres:13
    container_name: cultivatrace_db
    environment:
      POSTGRES_DB: cultivatrace
      POSTGRES_USER: cultiva
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

###> sensiolabs/gotenberg-bundle ###
  gotenberg:
    image: 'gotenberg/gotenberg:8'
###< sensiolabs/gotenberg-bundle ###

volumes:
  pgdata:
  vendor:
  symfony_var:
