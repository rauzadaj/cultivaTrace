services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cultivatrace_app
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
      - symfony_var:/var/www/html/var
    depends_on:
      - db
    environment:
      APP_ENV: dev
      APP_AUTO_BOOTSTRAP: "1"
      APP_BOOTSTRAP_SEED_DEMO: "1"
      APP_BOOTSTRAP_SEED_CATALOG: "1"
      DATABASE_URL: postgresql://cultiva:password@db:5432/cultivatrace?serverVersion=13&charset=utf8

  web:
    image: nginx:1.27-alpine
    container_name: cultivatrace_web
    depends_on:
      - app
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  db:
    image: postgres:13
    container_name: cultivatrace_db
    environment:
      POSTGRES_DB: cultivatrace
      POSTGRES_USER: cultiva
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

###> sensiolabs/gotenberg-bundle ###
  gotenberg:
    image: 'gotenberg/gotenberg:8'
###< sensiolabs/gotenberg-bundle ###

###> symfony/mercure-bundle ###
  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      MERCURE_SUBSCRIBER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      # Set the URL of your Symfony project (without trailing slash!) as value of the cors_origins directive
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://127.0.0.1:8000
    # Comment the following line to disable the development mode
    command: /usr/bin/caddy run --config /etc/caddy/dev.Caddyfile
    ports: 
      - "9000:80" 
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthz"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - mercure_data:/data
      - mercure_config:/config
###< symfony/mercure-bundle ###

volumes:
  pgdata:
  vendor:
  symfony_var:

###> symfony/mercure-bundle ###
  mercure_data:
  mercure_config:
###< symfony/mercure-bundle ###
