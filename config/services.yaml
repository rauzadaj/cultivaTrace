# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.storage.kyb_root: '%kernel.project_dir%/var/storage/licenses'
    app.storage.report_root: '%kernel.project_dir%/var/storage/report_exports'
    app.billing.alert_from_email: 'billing@cultivatrace.app'
    app.sales.contact_email: 'sales@cultivatrace.app'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Application\Cultivation\Analytics\CropCycleAnalyticsGateway: '@App\Infrastructure\Persistence\Doctrine\Repository\DoctrineCropCycleAnalyticsGateway'
    App\Application\Catalog\SeedCatalog\SeedCatalogProvider: '@App\Infrastructure\Catalog\Humboldt\HumboldtSeedCatalogProvider'

    App\Infrastructure\Http\Controller\:
        resource: '../src/Infrastructure/Http/Controller/'
        tags: ['controller.service_arguments']

    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    App\EventListener\TenantListener:
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: -10 }

    App\EventListener\KybAccessListener:
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: -20 }

    App\Infrastructure\Persistence\Doctrine\EventSubscriber\FarmTenantSubscriber:
        tags:
            - { name: doctrine.event_subscriber }

    App\Infrastructure\Persistence\Doctrine\EventSubscriber\CropTenantSubscriber:
        tags:
            - { name: doctrine.event_subscriber }


    App\Service\StripeService:
        arguments:
            $stripeSecretKey: '%env(STRIPE_SECRET_KEY)%'
            $stripeWebhookSecret: '%env(STRIPE_WEBHOOK_SECRET)%'
            $priceGrowth: '%env(STRIPE_PRICE_GROWTH)%'
            $pricePro: '%env(STRIPE_PRICE_PRO)%'
            $priceScale: '%env(STRIPE_PRICE_SCALE)%'
            $priceEnterprise: '%env(STRIPE_PRICE_ENTERPRISE)%'
            $alertFromEmail: '%env(default:app.billing.alert_from_email:STRIPE_ALERT_FROM_EMAIL)%'
            # Legacy price IDs — set during migration window to handle pre-rename subscriptions; remove after all customers migrate
            $priceStarter: '%env(default::STRIPE_PRICE_LEGACY_STARTER)%'
            $priceBusiness: '%env(default::STRIPE_PRICE_LEGACY_BUSINESS)%'

    App\Scheduler\LicenseExpirationScheduler:
        arguments:
            $alertFromEmail: '%env(LICENSE_ALERT_FROM_EMAIL)%'

    App\Command\CheckExpiredLicensesCommand:
        arguments:
            $alertFromEmail: '%env(LICENSE_ALERT_FROM_EMAIL)%'

    App\Service\KybService:
        arguments:
            $appEnv: '%kernel.environment%'
            $metrcApiKey: '%env(KYB_METRC_API_KEY)%'
            $alertFromEmail: '%env(KYB_ALERT_FROM_EMAIL)%'
            $adminReviewEmail: '%env(KYB_ADMIN_REVIEW_EMAIL)%'
            $adminReviewUrl: '%env(KYB_ADMIN_REVIEW_URL)%'
            $appUrl: '%env(FRONTEND_URL)%'
            $supportEmail: '%env(KYB_SUPPORT_EMAIL)%'
            $devSimulationEnabled: '%env(bool:KYB_ENABLE_DEV_SIMULATION)%'

    App\Infrastructure\Http\Controller\RegisterUserController:
        arguments:
            $registerRateLimiter: '@limiter.api_register'

    App\Infrastructure\Http\Controller\RegisterOrganizationController:
        arguments:
            $registerRateLimiter: '@limiter.api_register'

    App\Infrastructure\Http\EventSubscriber\ApiRateLimitSubscriber:
        arguments:
            $apiGlobalLimiter: '@limiter.api_global'
            $apiAuthLoginLimiter: '@limiter.api_auth_login'
            $apiAuthRefreshLimiter: '@limiter.api_auth_refresh'
            $apiKybWriteLimiter: '@limiter.api_kyb_write'
            $apiBillingWriteLimiter: '@limiter.api_billing_write'

    App\Service\Auth\LoginAttemptService:
        arguments:
            $cache: '@cache.app'

    App\Service\Storage\ArtifactStorage:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $kybStorageRoot: '%env(default:app.storage.kyb_root:KYB_STORAGE_ROOT)%'
            $reportStorageRoot: '%env(default:app.storage.report_root:REPORT_EXPORT_STORAGE_ROOT)%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    services:
        app.test.rate_limiter.storage:
            class: Symfony\Component\RateLimiter\Storage\InMemoryStorage

        test.workflow.registry:
            alias: workflow.registry
            public: true

        test.state_machine.crop_lifecycle:
            alias: state_machine.crop_lifecycle
            public: true

        test.App\Application\Cultivation\Workflow\CropLifecycleManager:
            alias: App\Application\Cultivation\Workflow\CropLifecycleManager
            public: true
