framework:
    workflows:
        crop_lifecycle:
            type: state_machine
            audit_trail:
                enabled: true
            marking_store:
                type: method
                property: currentStageValue
            supports:
                - App\Domain\Cultivation\Model\Crop
            initial_marking: seedling
            places:
                - seedling
                - veg
                - flower
                - harvest
            transitions:
                start_vegetative:
                    from: seedling
                    to: veg
                start_flowering:
                    from: veg
                    to: flower
                harvest:
                    from: flower
                    to: harvest

        plant_lifecycle:
            type: state_machine
            audit_trail:
                enabled: true
            marking_store:
                type: method
                property: statusValue
            supports:
                - App\Domain\Plant\Plant
            initial_marking: germination
            places:
                - germination
                - vegetative
                - flowering
                - harvested
                - destroyed
                - quarantine
            transitions:
                grow:
                    from: germination
                    to: vegetative
                flower:
                    from: vegetative
                    to: flowering
                harvest:
                    from: flowering
                    to: harvested
                quarantine:
                    from:
                        - germination
                        - vegetative
                        - flowering
                        - harvested
                        - destroyed
                        - quarantine
                    to: quarantine
                destroy:
                    from:
                        - germination
                        - vegetative
                        - flowering
                        - harvested
                        - destroyed
                        - quarantine
                    to: destroyed
                release_to_vegetative:
                    from: quarantine
                    to: vegetative
                release_to_flowering:
                    from: quarantine
                    to: flowering
