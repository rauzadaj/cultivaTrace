security:
    role_hierarchy:
        # ROLE_VIEWER is the read-only floor (accountant / inspector / investor).
        # Operational roles inherit it, so viewers can read what users read while
        # every mutating operation still requires ROLE_ORG_USER or above.
        ROLE_ORG_USER: [ROLE_VIEWER]
        ROLE_ORG_ADMIN: [ROLE_ORG_USER]
        ROLE_SUPER_ADMIN: [ROLE_ORG_ADMIN]

    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider_by_email:
            entity:
                class: App\Entity\User
                property: email

        app_user_provider_by_id:
            entity:
                class: App\Entity\User
                property: id

    firewalls:
        dev:
            pattern: ^/_(profiler|wdt)
            security: false

        webhook:
            pattern: ^/api/billing/webhook
            security: false

        login:
            pattern:  ^/api/auth/login
            stateless: true
            provider: app_user_provider_by_email
            user_checker: App\Security\UserChecker
            json_login:
                check_path: api_auth_login
                username_path: email
                password_path: password
                success_handler: App\Security\AuthenticationSuccessHandler
                failure_handler: App\Security\AuthenticationFailureHandler

        api:
            pattern:   ^/api
            stateless: true
            provider: app_user_provider_by_id
            user_checker: App\Security\UserChecker
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider_by_email

    access_control:
        - { path: ^/api/billing/webhook, roles: PUBLIC_ACCESS }
        - { path: ^/api/health, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/verify-email, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/token/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/register/organization, roles: PUBLIC_ACCESS }
        - { path: ^/api/register/invitation/accept, roles: PUBLIC_ACCESS }
        - { path: ^/api,       roles: IS_AUTHENTICATED_FULLY }
