parameters:
    app.default_mercure_url: 'http://127.0.0.1/.well-known/mercure'
    app.default_mercure_public_url: 'http://127.0.0.1/.well-known/mercure'
    app.default_mercure_jwt_secret: 'change-me-in-production'

# config/packages/mercure.yaml
#
# Configuration du hub Mercure pour les Server-Sent Events (SSE).
# Mercure remplace WebSocket — natif Symfony, plus simple à déployer.
#
# Variables d'env requises dans .env :
#   MERCURE_URL=http://mercure/.well-known/mercure
#   MERCURE_PUBLIC_URL=http://localhost/.well-known/mercure
#   MERCURE_JWT_SECRET=cannas_mercure_secret_change_in_prod

mercure:
    hubs:
        default:
            url: '%env(default:app.default_mercure_url:MERCURE_URL)%'
            public_url: '%env(default:app.default_mercure_public_url:MERCURE_PUBLIC_URL)%'
            jwt:
                secret: '%env(default:app.default_mercure_jwt_secret:MERCURE_JWT_SECRET)%'
                publish: '*'
                subscribe: '*'
