api_platform:
    title: CultivaTrace API
    version: 1.0.0
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
        # Hard cap so a client can never request an unbounded collection
        # (e.g. ?itemsPerPage=999999). Default page size stays 30.
        pagination_maximum_items_per_page: 100
