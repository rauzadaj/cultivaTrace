nelmio_cors:
    defaults:
        origin_regex: false
        allow_origin: []
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization', 'Accept', 'Origin']
        expose_headers: ['Link', 'X-Total-Count']
        max_age: 3600

    paths:
        '^/api/':
            allow_origin:
                - '%env(CORS_ALLOW_ORIGIN)%'
            allow_credentials: false
            max_age: 3600

        '^/.well-known/mercure':
            allow_origin:
                - '%env(CORS_ALLOW_ORIGIN)%'
            allow_credentials: false
            max_age: 3600

when@dev:
    nelmio_cors:
        paths:
            '^/api/':
                allow_origin:
                    - 'http://localhost:5173'
                    - 'http://localhost:3000'
                    - '%env(CORS_ALLOW_ORIGIN)%'
                allow_credentials: false

            '^/.well-known/mercure':
                allow_origin:
                    - 'http://localhost:5173'
                    - 'http://localhost:3000'
                    - '%env(CORS_ALLOW_ORIGIN)%'
                allow_credentials: false

when@test:
    nelmio_cors:
        paths:
            '^/api/':
                allow_origin:
                    - 'http://localhost:5173'
                allow_credentials: false

            '^/.well-known/mercure':
                allow_origin:
                    - 'http://localhost:5173'
                allow_credentials: false
