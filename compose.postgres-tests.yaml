services:
  postgres-tests:
    image: postgres:16
    environment:
      POSTGRES_USER: cultivatrace_test
      POSTGRES_PASSWORD: local-integration-only
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cultivatrace_test -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
